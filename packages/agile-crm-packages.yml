  newest_official_release: '2017-02-24'
  newest_official_commit: '2019-06-17'
  note: >-
    Every first-party SDK predates 2020. The most recently touched official client (nodejs) was last
    pushed 2019-06-17; the newest registry release of any first-party package is agile_crm 1.2.5 on
    2017-02-24. The REST API itself is still live (an unauthenticated call to
    https://{domain}.agilecrm.com/dev/api/contacts returns 401, not 404), so the SDK layer has decayed
    well behind the API it wraps.
