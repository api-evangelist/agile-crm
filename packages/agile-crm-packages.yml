description: >-
  First-party Agile CRM client libraries. Agile CRM distributes almost all of its SDKs as SOURCE ON
  GITHUB ONLY — the /api developer page links every client library to a github.com/agilecrm repo, not
  to a package registry. Only the Node.js client was ever published to a registry (npm), and it was
  last released in 2017. There is no Agile CRM package on Maven Central, NuGet, RubyGems, Packagist
  or crates.io, so the Java, C#, Ruby, PHP, iOS and Android clients must be vendored from GitHub by
  hand. Every registry below was queried unauthenticated on 2026-08-13.
summary:
