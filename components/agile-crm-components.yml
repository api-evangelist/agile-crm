description: >-
  Client-side and embeddable surfaces Agile CRM ships alongside its REST API. The vendor's own
  developer page groups these under a "Components" heading, distinct from its server-side SDKs, and
  describes them as "ready to deploy components... for commonly used, front-end functionality (e.g.
  lead capture)". All are distributed as source and instructions on GitHub — none is published to npm
  or a CDN with a versioned URL, so no component here can be pinned to a version.
