tools:
- name: search_contacts
  description: Search contacts and companies by keyword across the tenant.
  rest: searchContactsAndCompanies
  operation: GET /api/search
- name: get_contact_by_email
  description: Look up a single contact by email address.
  rest: getContactByEmail
  operation: GET /api/contacts/search/email/{email}
- name: create_contact
  description: Create a contact (or a company when type is COMPANY). first_name is mandatory.
  rest: createContact
  operation: POST /api/contacts
- name: update_contact_properties
  description: Partially update the properties of an existing contact by id.
  rest: updateContactProperties
  operation: PUT /api/contacts/edit-properties
- name: tag_contact
  description: Add tags to a contact by id.
  rest: addContactTags
  operation: PUT /api/contacts/edit/tags
- name: list_deals
  description: List all deals (opportunities) in the tenant, paged by page_size and cursor.
  rest: listDeals
  operation: GET /api/opportunity
- name: create_deal
  description: Create a deal. Requires name, expected_value, probability, milestone and pipeline_id.
  rest: createDeal
  operation: POST /api/opportunity
- name: update_deal
  description: Partially update a deal by id.
  rest: updateDeal
  operation: PUT /api/opportunity/partial-update
- name: list_contact_deals
  description: List the deals related to a specific contact.
  rest: listContactDeals
  operation: GET /api/contacts/{id}/deals
- name: create_task
  description: Create a task with type, priority_type, due and subject.
  rest: createTask
  operation: POST /api/tasks
- name: list_pending_tasks
  description: List tasks pending within a given number of days.
  rest: listPendingTasks
  operation: GET /api/tasks/pending/{num_days}
- name: create_note
  description: Create a note and relate it to one or more contacts.
  rest: createNote
  operation: POST /api/notes
- name: list_tickets
  description: List helpdesk tickets.
  rest: listTickets
  operation: GET /api/tickets/filter
- name: create_ticket
  description: Open a new helpdesk ticket.
  rest: createTicket
  operation: POST /api/tickets/new-ticket
- name: enroll_contact_in_campaign
  description: Add a contact to a marketing campaign by email.
  rest: enrollContactInCampaign
  operation: POST /api/campaigns/enroll/email
