openapi: 3.1.0
info:
  title: Agile CRM REST API
  version: 1.0.0
  description: HTTPS-only REST API for managing contacts, companies, deals (opportunities), campaigns, tasks, events, notes,
    tracks, tickets, and documents in Agile CRM. Authentication is HTTP Basic with account email as username and REST client
    API key as password.
  contact:
    name: Agile CRM
    url: https://www.agilecrm.com/api
servers:
- url: https://{domain}.agilecrm.com/dev
  description: Tenant-scoped base URL
  variables:
    domain:
      default: mydomain
      description: Your Agile CRM tenant subdomain
tags:
- name: Contacts
- name: Companies
- name: Campaigns
- name: Deals
- name: Notes
- name: Tasks
- name: Events
- name: Tracks
- name: HelpDesk
- name: Documents
paths:
  /api/campaigns/enroll/email:
    post:
      tags:
      - Campaigns
      summary: Add a contact to a campaign
      responses:
        '200':
          description: Contact enrolled
      operationId: enrollContactInCampaign
  /api/contacts:
    get:
      tags:
      - Contacts
      summary: List contacts ordered by creation time
      responses:
        '200':
          description: Contact list
      operationId: listContacts
    post:
      tags:
      - Contacts
      summary: Create a new contact (or company when type is COMPANY)
      responses:
        '200':
          description: Contact created
      operationId: createContact
  /api/contacts/add-score:
    post:
      tags:
      - Contacts
      summary: Adjust lead score
      responses:
        '200':
          description: Score adjusted
      operationId: addLeadScore
  /api/contacts/add/property:
    post:
      tags:
      - Contacts
      summary: Update a single contact property
      responses:
        '200':
          description: Property updated
      operationId: updateContactProperty
  /api/contacts/change-owner:
    post:
      tags:
      - Contacts
      summary: Reassign contact owner
      responses:
        '200':
          description: Owner reassigned
      operationId: changeContactOwner
  /api/contacts/companies/list:
    post:
      tags:
      - Companies
      summary: Retrieve company list
      responses:
        '200':
          description: Companies
      operationId: listCompanies
  /api/contacts/delete/tags:
    put:
      tags:
      - Contacts
      summary: Remove tags from a contact
      responses:
        '200':
          description: Tags removed
      operationId: deleteContactTags
  /api/contacts/edit-properties:
    put:
      tags:
      - Contacts
      summary: Partially update contact properties
      responses:
        '200':
          description: Properties updated
      operationId: updateContactProperties
  /api/contacts/edit/add-star:
    put:
      tags:
      - Contacts
      summary: Update star rating
      responses:
        '200':
          description: Star rating updated
      operationId: updateStarValue
  /api/contacts/edit/lead-score:
    put:
      tags:
      - Contacts
      summary: Modify lead score
      responses:
        '200':
          description: Lead score updated
      operationId: updateLeadScore
  /api/contacts/edit/tags:
    put:
      tags:
      - Contacts
      summary: Add tags to a contact
      responses:
        '200':
          description: Tags added
      operationId: addContactTags
  /api/contacts/email/note/add:
    post:
      tags:
      - Notes
      summary: Add a note via email
      responses:
        '200':
          description: Note added
      operationId: addNoteByEmail
  /api/contacts/email/tags/add:
    post:
      tags:
      - Contacts
      summary: Add tags via email
      responses:
        '200':
          description: Tags added
      operationId: addTagsByEmail
  /api/contacts/email/tags/delete:
    post:
      tags:
      - Contacts
      summary: Remove tags via email
      responses:
        '200':
          description: Tags removed
      operationId: deleteTagsByEmail
  /api/contacts/notes/bulk:
    post:
      tags:
      - Notes
      summary: Bulk delete notes
      responses:
        '200':
          description: Notes deleted
      operationId: bulkDeleteNotes
  /api/contacts/search/email:
    post:
      tags:
      - Contacts
      summary: Search multiple contacts by email
      responses:
        '200':
          description: Contacts found
      operationId: searchContactsByEmail
  /api/contacts/search/email/{email}:
    get:
      tags:
      - Contacts
      summary: Find a contact by email
      parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Contact found
      operationId: getContactByEmail
  /api/contacts/search/phonenumber/{phone}:
    get:
      tags:
      - Contacts
      summary: Locate a contact by phone number
      parameters:
      - name: phone
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Contact found
      operationId: getContactByPhone
  /api/contacts/{contact_id}/events/sort:
    get:
      tags:
      - Events
      summary: Get events for a contact
      parameters:
      - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Events
      operationId: listContactEvents
  /api/contacts/{contact_id}/notes:
    get:
      tags:
      - Notes
      summary: Get notes for a contact
      parameters:
      - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Notes
      operationId: listContactNotes
  /api/contacts/{contact_id}/notes/{note_id}:
    delete:
      tags:
      - Notes
      summary: Remove a contact note
      parameters:
      - $ref: '#/components/parameters/ContactId'
      - name: note_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
      operationId: deleteContactNote
  /api/contacts/{contact_id}/tasks/sort:
    get:
      tags:
      - Contacts
      summary: Get associated tasks for a contact
      parameters:
      - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Tasks
      operationId: listContactTasks
  /api/contacts/{id}:
    get:
      tags:
      - Contacts
      summary: Get a contact by ID
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Contact details
      operationId: getContact
    delete:
      tags:
      - Contacts
      summary: Delete a contact
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Contact deleted
      operationId: deleteContact
  /api/contacts/{id}/deals:
    get:
      tags:
      - Deals
      summary: Get deals linked to a contact
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deals
      operationId: listContactDeals
  /api/documents:
    post:
      tags:
      - Documents
      summary: Create a document for a contact
      responses:
        '200':
          description: Document created
      operationId: createDocument
    put:
      tags:
      - Documents
      summary: Update a contact document
      responses:
        '200':
          description: Document updated
      operationId: updateDocument
  /api/documents/contact/{contact_id}/docs:
    get:
      tags:
      - Documents
      summary: Get contact documents
      parameters:
      - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Documents
      operationId: listContactDocuments
  /api/events:
    get:
      tags:
      - Events
      summary: List events
      responses:
        '200':
          description: Events
      operationId: listEvents
    post:
      tags:
      - Events
      summary: Create an event
      responses:
        '200':
          description: Event created
      operationId: createEvent
  /api/events/{id}:
    put:
      tags:
      - Events
      summary: Update an event
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Event updated
      operationId: updateEvent
    delete:
      tags:
      - Events
      summary: Delete an event
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Event deleted
      operationId: deleteEvent
  /api/filters/filter/dynamic-filter:
    post:
      tags:
      - Contacts
      summary: Filter contacts dynamically
      responses:
        '200':
          description: Filtered contacts
      operationId: filterContactsDynamic
  /api/milestone/pipelines:
    get:
      tags:
      - Tracks
      summary: List tracks
      responses:
        '200':
          description: Tracks
      operationId: listTracks
    post:
      tags:
      - Tracks
      summary: Create a track
      responses:
        '200':
          description: Track created
      operationId: createTrack
    put:
      tags:
      - Tracks
      summary: Update a track
      responses:
        '200':
          description: Track updated
      operationId: updateTrack
  /api/milestone/pipelines/{id}:
    delete:
      tags:
      - Tracks
      summary: Delete a track
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Track deleted
      operationId: deleteTrack
  /api/notes:
    post:
      tags:
      - Notes
      summary: Create a note and relate to contacts
      responses:
        '200':
          description: Note created
      operationId: createNote
  /api/notes/{ticket_id}:
    post:
      tags:
      - HelpDesk
      summary: Add note to a ticket
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Note added
      operationId: addTicketNote
  /api/opportunity:
    get:
      tags:
      - Deals
      summary: List all deals
      responses:
        '200':
          description: Deals
      operationId: listDeals
    post:
      tags:
      - Deals
      summary: Create a deal
      responses:
        '200':
          description: Deal created
      operationId: createDeal
  /api/opportunity/based:
    get:
      tags:
      - Deals
      summary: Get deals from a track
      responses:
        '200':
          description: Deals
      operationId: listDealsByTrack
  /api/opportunity/bulk:
    post:
      tags:
      - Deals
      summary: Bulk delete deals
      responses:
        '200':
          description: Deals deleted
      operationId: bulkDeleteDeals
  /api/opportunity/byMilestone:
    get:
      tags:
      - Deals
      summary: Get deals grouped by milestone
      responses:
        '200':
          description: Deals by milestone
      operationId: listDealsByMilestone
  /api/opportunity/byPipeline/based:
    get:
      tags:
      - Deals
      summary: Retrieve deals by pipeline
      responses:
        '200':
          description: Deals
      operationId: listDealsByPipeline
  /api/opportunity/deals/notes:
    post:
      tags:
      - Notes
      summary: Create a deal note
      responses:
        '200':
          description: Note created
      operationId: createDealNote
    put:
      tags:
      - Notes
      summary: Update a deal note
      responses:
        '200':
          description: Note updated
      operationId: updateDealNote
  /api/opportunity/email/{email}:
    post:
      tags:
      - Deals
      summary: Create a deal for a contact by email
      parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deal created
      operationId: createDealForContactByEmail
  /api/opportunity/my/deals:
    get:
      tags:
      - Deals
      summary: Retrieve the calling user's deals
      responses:
        '200':
          description: Deals
      operationId: listMyDeals
  /api/opportunity/partial-update:
    put:
      tags:
      - Deals
      summary: Partially update a deal
      responses:
        '200':
          description: Deal updated
      operationId: updateDeal
  /api/opportunity/partial-update/delete-contact:
    put:
      tags:
      - Deals
      summary: Remove contacts from a deal
      responses:
        '200':
          description: Updated
      operationId: removeDealContacts
  /api/opportunity/{deal_id}/notes:
    get:
      tags:
      - Notes
      summary: Get deal notes
      parameters:
      - name: deal_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Notes
      operationId: listDealNotes
  /api/opportunity/{id}:
    get:
      tags:
      - Deals
      summary: Get deal by ID
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deal
      operationId: getDeal
    delete:
      tags:
      - Deals
      summary: Delete a deal
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
      operationId: deleteDeal
  /api/search:
    get:
      tags:
      - Contacts
      summary: Search contacts and companies by keyword
      responses:
        '200':
          description: Search results
      operationId: searchContactsAndCompanies
  /api/tasks:
    get:
      tags:
      - Tasks
      summary: List all tasks
      responses:
        '200':
          description: Tasks
      operationId: listTasks
    post:
      tags:
      - Tasks
      summary: Create a task
      responses:
        '200':
          description: Task created
      operationId: createTask
  /api/tasks/based:
    get:
      tags:
      - Tasks
      summary: Retrieve tasks with filters
      responses:
        '200':
          description: Tasks
      operationId: listTasksFiltered
  /api/tasks/email/{email}:
    post:
      tags:
      - Tasks
      summary: Create a task for a contact by email
      parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Task created
      operationId: createTaskForContactByEmail
  /api/tasks/partial-update:
    put:
      tags:
      - Tasks
      summary: Partially update a task
      responses:
        '200':
          description: Task updated
      operationId: updateTask
  /api/tasks/pending/{num_days}:
    get:
      tags:
      - Tasks
      summary: Get pending tasks by days
      parameters:
      - name: num_days
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Tasks
      operationId: listPendingTasks
  /api/tasks/{id}:
    get:
      tags:
      - Tasks
      summary: Get task by ID
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Task
      operationId: getTask
    delete:
      tags:
      - Tasks
      summary: Delete a task
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Task deleted
      operationId: deleteTask
  /api/tickets/filter:
    get:
      tags:
      - HelpDesk
      summary: Retrieve all tickets
      responses:
        '200':
          description: Tickets
      operationId: listTickets
  /api/tickets/filters:
    get:
      tags:
      - HelpDesk
      summary: Get filter IDs
      responses:
        '200':
          description: Filters
      operationId: listTicketFilters
  /api/tickets/new-ticket:
    post:
      tags:
      - HelpDesk
      summary: Create a ticket
      responses:
        '200':
          description: Ticket created
      operationId: createTicket
  /api/tickets/notes/{ticket_id}:
    get:
      tags:
      - HelpDesk
      summary: Get ticket messages
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Messages
      operationId: listTicketMessages
  /api/tickets/{id}:
    delete:
      tags:
      - HelpDesk
      summary: Delete a ticket
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Ticket deleted
      operationId: deleteTicket
  /api/workflows:
    get:
      tags:
      - Campaigns
      operationId: listCampaigns
      summary: List campaigns (workflows)
      description: 'Returns a list of campaigns. Paging can be applied using the page_size and cursor query parameters. Source:
        https://github.com/agilecrm/rest-api README section 8.'
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Campaign list
  /api/workflows/remove-active-subscriber/{workflowId}/{contactId}:
    delete:
      tags:
      - Campaigns
      summary: Remove contact from a campaign workflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: contactId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Removed
      operationId: removeCampaignSubscriber
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    ContactId:
      name: contact_id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic auth - username is account email, password is REST client API key.
security:
- BasicAuth: []
