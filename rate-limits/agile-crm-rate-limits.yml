  occurrence of "rate limit", "throttle", "quota per second/minute/hour", "429", "Retry-After",
  "X-RateLimit" or "RateLimit-" anywhere in its text, and neither the /api developer page nor the
  pricing page names a request-rate ceiling on any tier. An honest zero, recorded as data.
