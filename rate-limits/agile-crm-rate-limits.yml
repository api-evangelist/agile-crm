implications:
  note: >-
    With no published limit and no response header, an API client has no way to pace itself and no
    runtime signal to back off on. Retry logic cannot key on Retry-After, and because the API also
    has no idempotency mechanism (see conventions/agile-crm-conventions.yml), a blind retry after a
    timeout duplicates writes. Callers should self-impose a conservative rate.
